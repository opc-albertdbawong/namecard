
<!DOCTYPE html>
<html lang="en" data-theme="ocean-blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Digital Business Card</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme-ocean-blue.css" id="theme-stylesheet">
</head>
<body>

<div class="card">
    <!-- HEADER -->
    <div class="card-header">
        <img class="logo" id="card-logo" alt="Ocean Park Corporation">
        <h1 id="card-name"></h1>
        <p class="title" id="card-title"></p>
        <p class="company" id="card-company"></p>
    </div>

    <!-- CONTACT INFO - rendered by JS -->
    <div class="card-body" id="card-body"></div>

    <!-- SAVE CONTACT BUTTON + QR CODE -->
    <div class="card-footer">
        <button class="btn-save" onclick="saveContact()">
            <span>📥</span> Save to Contacts
        </button>

        <div class="qr-section">
            <p>Scan to view this card</p>
            <div class="qr-code">
                <img id="qrcode" alt="QR Code" width="150" height="150">
            </div>
        </div>
    </div>
</div>

<script>
// ============================================
// SINGLE DATA SOURCE
// All card display AND vCard generation use this.
// For the template system, this block will be
// injected by the generator script.
// ============================================
const contact = {
    firstName: "Albert",
    lastName: "Wong",
    title: "Assistant Director, IT Application",
    company: "Ocean Park Corporation",
    logo: "https://api.oceanpark.com.hk/media/rkwfxwh1/oceanpark_logo.webp",
    // Phone: split for obfuscation
    phoneDirect: { parts: ["+852","3923","2895"], type: "WORK,VOICE", label: "Direct", icon: "📞" },
    phoneMobile: { parts: ["+852","9612","6598"], type: "CELL", label: "Mobile", icon: "📱" },
    // Email: split for obfuscation
    email: { user: "albert.dba.wong", domain: "oceanpark.com.hk", type: "WORK", label: "Email", icon: "✉️" },
    // URLs
    urls: [
        { url: "https://www.oceanpark.com.hk", display: "www.oceanpark.com.hk", label: "Ocean Park", icon: "🌐", vcardType: "WORK" },
        { url: "https://waterworld.oceanpark.com.hk", display: "waterworld.oceanpark.com.hk", label: "Water World", icon: "🌊", vcardLabel: "Water World" },
        { url: "https://linkedin.com/in/albertdbwong", display: "linkedin.com/in/albertdbwong", label: "LinkedIn", icon: "💼", vcardLabel: "LinkedIn", social: "linkedin" }
    ],
    cardUrl: "https://opc-albertdbawong.github.io/namecard",
    theme: "ocean-blue"
};

// ============================================
// RENDER CARD FROM DATA
// ============================================
function renderCard() {
    // Page title
    document.getElementById("page-title").textContent = `${contact.firstName} ${contact.lastName} - Digital Business Card`;

    // Header
    document.getElementById("card-logo").src = contact.logo;
    document.getElementById("card-name").textContent = `${contact.firstName} ${contact.lastName}`;
    document.getElementById("card-title").textContent = contact.title;
    document.getElementById("card-company").textContent = contact.company;

    // Contact items
    const body = document.getElementById("card-body");
    let html = "";

    // Phone numbers
    [contact.phoneDirect, contact.phoneMobile].forEach(phone => {
        const number = phone.parts.join("");
        const display = phone.parts.join(" ");
        html += `<a href="tel:${number}" class="contact-item">
            <div class="icon icon-phone">${phone.icon}</div>
            <div class="details">
                <div class="label">${phone.label}</div>
                <div class="value">${display}</div>
            </div>
        </a>`;
    });

    // Email
    const emailFull = `${contact.email.user}@${contact.email.domain}`;
    html += `<a href="mailto:${emailFull}" class="contact-item">
        <div class="icon icon-email">${contact.email.icon}</div>
        <div class="details">
            <div class="label">${contact.email.label}</div>
            <div class="value">${emailFull}</div>
        </div>
    </a>`;

    // URLs
    contact.urls.forEach(u => {
        html += `<a href="${u.url}" target="_blank" class="contact-item">
            <div class="icon icon-web">${u.icon}</div>
            <div class="details">
                <div class="label">${u.label}</div>
                <div class="value">${u.display}</div>
            </div>
        </a>`;
    });

    body.innerHTML = html;
}

// ============================================
// SAVE CONTACT AS .VCF FILE
// ============================================
function saveContact() {
    const emailFull = `${contact.email.user}@${contact.email.domain}`;
    const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${contact.firstName} ${contact.lastName}`,
        `N:${contact.lastName};${contact.firstName};;;`,
        `TITLE:${contact.title}`,
        `ORG:${contact.company}`,
        `TEL;TYPE=${contact.phoneDirect.type}:${contact.phoneDirect.parts.join("")}`,
        `TEL;TYPE=${contact.phoneMobile.type}:${contact.phoneMobile.parts.join("")}`,
        `EMAIL;TYPE=${contact.email.type}:${emailFull}`
    ];

    // URLs: first one with TYPE for Outlook, rest with item grouping for iOS
    let itemIndex = 1;
    contact.urls.forEach((u, i) => {
        if (i === 0 && u.vcardType) {
            lines.push(`URL;TYPE=${u.vcardType}:${u.url}`);
        } else {
            lines.push(`item${itemIndex}.URL:${u.url}`);
            lines.push(`item${itemIndex}.X-ABLabel:${u.vcardLabel || u.label}`);
            itemIndex++;
        }
        // Social profile
        if (u.social) {
            lines.push(`X-SOCIALPROFILE;TYPE=${u.social}:${u.url}`);
        }
    });

    // Notes as fallback
    const noteUrls = contact.urls.slice(1).map(u => `${u.label}: ${u.url}`).join("\\n");
    if (noteUrls) lines.push(`NOTE:${noteUrls}`);

    lines.push("END:VCARD");

    const blob = new Blob([lines.join("\r\n")], { type: "text/vcard" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${contact.firstName}_${contact.lastName}.vcf`;
    link.click();
    URL.revokeObjectURL(url);
}

// ============================================
// QR CODE
// ============================================
function generateQR() {
    const qrImg = document.getElementById("qrcode");
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(contact.cardUrl)}`;
}

// ============================================
// INIT
// ============================================
renderCard();
generateQR();
</script>

</body>
</html>
